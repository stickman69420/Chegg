<!doctype HTML>
<html>
	<head>
		<title>Playing Chegg online</title>
		<script>
			addEventListener("error", (e) => {
				alert(e.lineno+":"+e.colno+", "+e.message+"\nMain")
			});
		</script>
		<meta charset="utf-8">
		<style id="allCss">
			body {
				padding: 0px;
				margin: 0px;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: Arial;
			}
			canvas {
				overflow: hidden;
				image-rendering: pixelated;
				/*border: black thin solid;*/
				display: inline;
			}
			iframe {
				border: none;
				background-color: white;
			}
		</style>
	</head>
	<body id="body">
		<div id="multiinit"><a href="./index.html">Back to home</a><br><a href="./chegg.html?offline=true">Switch to offline</a><br><e id="peerid">Connecting... </e><button id="cbut" onclick="copyid()" style="visibility: hidden;background-color: #00000000; border: none;"><img id="cimg" src="./images/ui/copy.png" style="height:1em;"></button><br><a id="conlink"></a><button id="cbut2" onclick="copylink()" style="visibility: hidden;background-color: #00000000; border: none;"><img id="cimg2" src="./images/ui/copy.png" style="height:1em;"></button><br><input id="inputid" placeholder="Opponent's id" onchange="connect()"></input></div><div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;" id="loadBarDiv"><progress style="width:50%;" id="loadBar" max="1" value="0"></progress></div><div id="out"></div><br>
		<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
		<script src="./definitions.js"></script>
		<script>
		
			// Source - https://stackoverflow.com/a/42067456
			// Posted by Jamesfo, modified by community. See post 'Timeline' for change history
			// Retrieved 2026-09-04, License - CC BY-SA 4.0
			GET = location.search.substr(1).split("&").reduce((o,i)=>(u=decodeURIComponent,[k,v]=i.split("="),o[u(k)]=v&&u(v),o),{});
			
			function procSpec(effect2,mine) {
				const effect = (effect2 ?? {})
				for (const [key,value] of Object.entries(effect)) {
					switch(key) {
						case ("draw"):
							if (mine) {
								for (let i=0;i<value;i++) {
									if (mydeck.length > 0) {
										addToDraw(mydeck[0])
										mydeck.splice(0,1)
									}
								}
							}
							break;
						case ("lose"):
							state = 2-mine
							clearInterval(gloop)
							let ctx = canvas.getContext("2d")
							ctx.fillStyle = !mine ? "#0F0" : "#F00"
							ctx.textBaseline = "top"
							ctx.textAlign = "center"
							ctx.font = "100px Arial"
							ctx.fillText(!mine ? "YOU WON YIPPEE" : "You lost",1350/2,0)
							break;
						case ("mana"):
							if (mine) mana += value
							break;
						case ("drawOp"):
							if (mine) sendData({"dataType":6,"count":value})
							break;
						case ("discard"):
							if (mine) draw.splice(0,value)
							break;
					}
				}
			}
			
			function allDone() {
				glc++
				if (glc == 2) initGame()
			}
			
			const inIframe = window.self !== window.top;
			
			function copyid() {
				navigator.clipboard.writeText(peerID)
				cimg.src = "./images/ui/copied.png"
				setTimeout(() => {
					cimg.src = "./images/ui/copy.png"
				},1000)
			}
			function copylink() {
				navigator.clipboard.writeText(conlink.innerHTML)
				cimg2.src = "./images/ui/copied.png"
				setTimeout(() => {
					cimg2.src = "./images/ui/copy.png"
				},1000)
			}
			
			const attacknames = ["slash","explosion","spike","sweep","arrow","fire"]
			const bgimgnames = ["black","white","blue","lblue","red","lred"]
			const maxload = unitnames.length*2+attacknames.length+bgimgnames.length
			loadUnits()
			let glc = 0
			let attackimgs = {}
			let bgimgs = []
			attacknames.forEach((e) => {
				attackimgs[e] = new Image()
				attackimgs[e].src = "./images/attacks/"+e+".png"
				attackimgs[e].onload = imageLoaded
			})
			bgimgnames.forEach((e,ee) => {
				bgimgs[ee] = new Image()
				bgimgs[ee].src = "./images/ui/"+e+".png"
				bgimgs[ee].onload = imageLoaded
			})
			/*unitnames.forEach((e) => {
				units.push(new Image())
				units.at(-1).src = "./images/units/"+e+".png"
				units.at(-1).onload = imageLoaded
			})*/
			globalThis.receiveData = function(data,first) {
				//out.insertAdjacentHTML("beforeend","<br>Received: "+typeof data+": "+JSON.stringify(data));
				if (data == "🫱") { //confirm handshake (if this player isn't connected to someone else)
					sendData("🤝");
					allDone()
				} else if (data == "🤝" && first) { //recieve confirmation
					allDone()
				}
				if (data == "turn") { //start next turn
					turn = true
					manamax = Math.min(manamax+1,6)
					mana = manamax
					myUnits.filter(u => u.moved).forEach((e) => {
						e.moved = 0
					})
					turncount++
					if (turncount == 2) {
						for (let i=0;i<3;i++) {
							if (mydeck.length > 0) {
								addToDraw(mydeck[0])
								mydeck.splice(0,1)
							}
						}
					} else if (turncount > 2 && mydeck.length > 0) {
						addToDraw(mydeck[0])
						mydeck.splice(0,1)
					}
					if (GET.offline) {
						if (inIframe) window.parent.document.getElementById("ifr").style.visibility = "visible"
						else ifr.style.visibility = "hidden"
					}
					myUnits.forEach((e) => {
						if (units[e.type].turn) procSpec(units[e.type].turn,true)
					})
				}
				switch (data.dataType) {
					case 0:
						enemUnits.push({...data,"dataType":undefined})
						break;
					case 1:
						enemUnits[data.unit].x = data.x
						enemUnits[data.unit].y = data.y
						break;
					case 2:
						procSpec(units[myUnits[data.unit].type].death,true)
						myUnits.splice(data.unit,1)
						break;
					case 3:
						procSpec(units[enemUnits[data.unit].type].death,false)
						enemUnits.splice(data.unit,1)
						break;
					case 4:
						animData["attack"+aid] = {"time":0,"length":(attackimgs[data.img].width/16)*(1/15),"frame":0,"anim":attackimgs[data.img],"x":data.x,"sx":data.x,"sy":data.y,"ox":data.ox,"oy":data.oy,"rot2":data.rot,"y":data.y,"w":data.w,"h":data.h,"frame":0,"update":function () {this.frame = Math.floor(this.time/this.length*(this.anim.width/16));this.x=this.ox+(this.sx-this.ox)/this.length*this.time;this.y=this.oy+(this.sy-this.oy)/this.length*this.time;if (this.rot2 === true) {this.rot = Math.atan2(this.sy-this.oy,this.sx-this.ox)} else {this.rot = this.rot2}}}
						aid++
						break;
					case 5:
						myUnits[data.unit].x = data.x
						myUnits[data.unit].y = data.y
						break;
					case 6:
						for (let i=0;i<data.count;i++) {
							if (mydeck.length > 0) {
								sendData({"dataType":7,"type":mydeck[0]})
								mydeck.splice(0,1)
							}
						}
						break;
					case 7:
						addToDraw(data.type)
						break;
				}
			}
			
			function sendData(data) {
				if (GET.offline) {
					if (inIframe) window.parent.receiveData(data)
					else ifr.contentWindow.receiveData(data,true)
				} else conn.send(data)
			}
			
			let ping
			
			function conevent(first) {
				conn.on("data", function (data) {
					receiveData(data,first)
				});
				out.insertAdjacentHTML("beforeend","<br>Connected to: "+conn.peer+" as player "+(pid+1));
				if (first) {
					sendData("🫱"); //initiate handshake
				}
			}
			
			function initGame() {
				multiinit.innerHTML = "<canvas id='canvas' width='1350' height='800'></canvas>"
				multiinit.style.width = "100%"
				multiinit.style.textAlign = "center"
				canvas.style.margin = "auto"
				ctx = canvas.getContext("2d")
				ctx.webkitImageSmoothingEnabled = false
				ctx.mozImageSmoothingEnabled = false
				ctx.imageSmoothingEnabled = false
				if (pid == 1) sendData("turn")
				setInterval(() => {
					if (conn && conn.peerConnection) {
						conn.peerConnection.getStats().then((r) => {
							r.forEach(function(t) {
								if (t.type === "candidate-pair") {
									if (t.currentRoundTripTime !== undefined) {
										ping = t.currentRoundTripTime * 1000;
									}
								}
							})
						})
						.catch ((err) => {
							alert(err.message)
						})
					}
				},1000)
				gloop = setInterval(() => {
					/*if (document.getElementById("ifr")) out.innerHTML = ifr.contentWindow.receiveData ? ifr.contentWindow.receiveData.toString() : "undefined"
					else out.innerHTML = "?"*/
					canvas.style.width = Math.min(100,(100/(canvas.height/canvas.width))*(window.innerHeight/window.innerWidth))+"%"
					if (!inIframe) {
						ifr.style.height = canvas.offsetHeight+"px"
						ifr.style.width = canvas.offsetWidth+"px"
					}
					ctx.clearRect(0,0,canvas.width,canvas.height)
					ctx.textBaseline = "top"
					ctx.font = "20px Arial"
					for (let i=0;i<10;i++) {
						for (let j=0;j<8;j++) {
							const pa = Math.abs(i-4.5) < 3
							//ctx.fillStyle = "hsl("+(i<=1 ? 220 : 0)+" "+(pa ? 0 : 100)+" "+((i+j)%2==0 ? (pa ? 0 : 25) : (pa ? 100 : 50))+")"
							//ctx.fillRect(i*100+50,j*100,100,100)
							ctx.drawImage(bgimgs[(i+j)%2+(i <= 1)*2+(i >= 8)*4],i*100+50,j*100,100,100)
						}
					}
					for (let [key,value] of Object.entries(animData)) {
						value.time += 0.016
						if (value.time >= value.length) delete animData[key]
						else {
							value.update()
						}
					}
					ctx.fillStyle = "#FFF"
					ctx.textAlign = "left"
					ctx.strokeRect(1050,0,300,800)
					ctx.fillStyle = "#A00"
					ctx.fillRect(0,0,50,800)
					ctx.fillStyle = "#FA0"
					ctx.strokeStyle = "#000"
					ctx.lineWidth = 3
					ctx.fillRect(0,800-(mana*800/6),50,mana*800/6)
					for (let i=0;i<mana;i++) {
						ctx.strokeRect(0,800-(i*800/6),50,-800/6)
					}
					ctx.strokeStyle = "#AAA"
					ctx.strokeRect(0,800-(manamax*800/6),50,manamax*800/6)
					ctx.lineWidth = 1
					ctx.fillStyle = "#000"
					if (mana > 6) ctx.fillText("+"+(mana-6),25,750)
					ctx.fillStyle = turn ? (myUnits.some(u => u.type == 0) ? "#FA0" : "#AAA") : "#A00"
					ctx.fillRect(1050,700,300,100)
					ctx.fillStyle = "#000"
					ctx.textAlign = "center"
					ctx.font = "50px arial"
					ctx.fillText("End turn",1200,725)
					ctx.fillStyle = pid ? "#00F" : "#F00"
					ctx.fillText("Player "+(pid+1),1150,625)
					ctx.fillStyle = clickable[0].state ? "#0F0" : "#F00"
					ctx.fillRect(clickable[0].x,clickable[0].y,clickable[0].w,clickable[0].h)
					ctx.fillStyle = "#000"
					ctx.font = "25px arial"
					ctx.textBaseline = "bottom"
					ctx.fillText("Priority:",clickable[0].x+clickable[0].w/2,clickable[0].y+clickable[0].h/2)
					ctx.textBaseline = "top"
					ctx.fillText(clickable[0].state ? "Move" : "Attack",clickable[0].x+clickable[0].w/2,clickable[0].y+clickable[0].h/2)
					ctx.fillStyle = "#FFF"
					ctx.strokeStyle = "#000"
					ctx.font = "50px arial"
					ctx.lineWidth = 2
					draw.forEach((e,ee) => {
						if (ee == sel && seltype == 0) {
							ctx.fillStyle = "#FF7"
							ctx.fillRect(1050+Math.floor(ee/6)*100,100*(ee%6),100,100)
							ctx.fillStyle = "#FFF"
						}
						ctx.drawImage(unitimgs[e],1050+Math.floor(ee/6)*100+(animData["shake"+ee] ?? {"off":0}).off,100*(ee%6),100,100)
						ctx.fillText("("+(units[e].cost ?? 0)+")",1100+Math.floor(ee/6)*100+(animData["shake"+ee] ?? {"off":0}).off,25+100*(ee%6))
						ctx.strokeText("("+(units[e].cost ?? 0)+")",1100+Math.floor(ee/6)*100+(animData["shake"+ee] ?? {"off":0}).off,25+100*(ee%6))
					})
					
					if (seltype == 1) {
						ctx.strokeStyle = "#000"
						ctx.fillStyle = "#0F07"
						movements.forEach((e) => {
							if (e.x >= 0 && e.x <= 9) ctx.fillRect(e.x*100+50,e.y*100,100,100)
						})
						ctx.fillStyle = "#F007"
						ctx.strokeStyle = "#FF0"
						attacks.forEach((e) => {
							if (e.colOver) ctx.fillStyle = e.colOver
							if (e.set) {
								e.set.forEach((r) => {
									if (r.x >= 0 && r.x <= 9) {
										ctx.fillRect(r.x*100+50,r.y*100,(r.w ?? 1)*100,(r.h ?? 1)*100)
										//ctx.strokeRect(e.x*100+50,e.y*100,(e.w ?? 1)*100,(e.h ?? 1)*100)
									}
									e.set.forEach((t) => {
										if (r != t) {
											ctx.beginPath()
											ctx.moveTo(50+r.x*100+(r.w ?? 1)*50,r.y*100+(r.h ?? 1)*50)
											ctx.lineTo(50+t.x*100+(t.w ?? 1)*50,t.y*100+(t.h ?? 1)*50)
											ctx.stroke()
										}
									})
								})
							} else {
								if (e.x >= 0 && e.x <= 9) {
									ctx.fillRect(e.x*100+50,e.y*100,(e.w ?? 1)*100,(e.h ?? 1)*100)
									ctx.strokeRect(e.x*100+50,e.y*100,(e.w ?? 1)*100,(e.h ?? 1)*100)
								}
							}
							if (e.colOver) ctx.fillStyle = "#F007"
						})
						/*const un = myUnits[sel]
						const unit = units[un.type]
						switch (unit.move.style) {
							case (0):
								const voff = Math.floor(unit.move.set.length/2)
								unit.move.set.forEach((e,ee) => {
									const hoff = Math.floor(e.length/2)
									e.forEach((r,rr) => {
										if (r) ctx.fillRect((un.x-hoff+rr)*100+50,(un.y-voff+ee)*100,100,100)
									})
								})
								break;
						}*/
					}
					
					myUnits.forEach((e) => {
						ctx.drawImage(unitimgs[e.type],50+100*e.x,100*e.y,100,100)
					})
					ctx.translate(50,0)
					ctx.rotate(Math.PI)
					enemUnits.forEach((e) => {
						ctx.drawImage(unitimgs[e.type],-100-100*e.x,-100-100*e.y,100,100)
					})
					out.innerHTML = JSON.stringify(animData)
					for (let [key,value] of Object.entries(animData)) {
						if (key.includes("attack")) {
							ctx.setTransform(1,0,0,1,value.x*100+50+value.w*50,value.y*100+value.h*50)
							let newwidth = value.w
							let newheight = value.h
							if (value.rot) {
								ctx.rotate(value.rot)
								newwidth = value.w*Math.cos(value.rot)+value.h*Math.sin(value.rot)
								newheight = value.h*Math.cos(value.rot)+value.w*Math.sin(value.rot)
							}
							ctx.drawImage(value.anim,value.frame*16,0,16,16,-newwidth*50,-newheight*50,newwidth*100,newheight*100)
						}
					}
					ctx.setTransform(1,0,0,1,0,0)
					ctx.fillStyle = "#FFF"
					ctx.textAlign = "left"
					if (ping) ctx.fillText("ping: "+ping+"ms",0,0)
				},16)
				canvas.addEventListener("click", function (e) {
					const loc = {"x":e.offsetX/canvas.offsetWidth*canvas.width,"y":e.offsetY/canvas.offsetHeight*canvas.height}
					clickable.forEach((r) => {
						if (loc.x >= r.x && loc.y >= r.y && loc.x <= r.x+r.w && loc.y <= r.y+r.h) r.onclick({"x":loc.x-r.x,"y":loc.y-r.y})
					})
				})
			}
			
			function addToDraw(id) {
				draw.push(id)
			}
			function selFromDraw(ind) {
				if (sel == undefined && turn && draw[ind] != undefined) {
					if (mana >= (units[draw[ind]].cost ?? 0)) {
						sel = ind
						seltype = 0
					} else {
						animData["shake"+ind] = {"time":0,"length":0.2,"off":0,"update":function () {this.off = 25*Math.sin(this.time*Math.PI*10)}}
					}
				} else if (sel == ind && seltype == 0) {
					sel = undefined
					seltype = undefined
				}
			}
			function shuffle(array) {
				let currentIndex = array.length
				while (currentIndex != 0) {
					const randomIndex = Math.floor(Math.random() * currentIndex)
					currentIndex--;
					[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]]
				}
			}
			
			let animData = {}
			let pid
			let peer
			if (!GET.offline) {
				peer = new Peer();
			}
			let peerID
			let conn
			let ctx
			let mana = 0
			let manamax = -1
			let turn = false
			let myUnits = []
			let enemUnits = []
			let draw = []
			let sel
			let seltype
			let movements = []
			let attacks = []
			let state = 0
			let gloop
			let turncount = 0
			let aid = 0
			const orth = [[1,0],[0,1],[-1,0],[0,-1]]
			let mydeck = inIframe ? deck2 : deck
			shuffle(mydeck)
			let clickable = [{"x":1250,"y":600,"w":100,"h":100,"state":true,"onclick":function () {this.state = !this.state}},{"x":1050,"y":700,"w":300,"h":100,"onclick":function() {if (turn && myUnits.some(u => u.type == 0)) {sendData("turn");turn = false;sel=undefined;seltype=undefined;} else if (turn) {alert("Place your villager first")}}},{"x":50,"y":0,"w":1000,"h":800,"onclick":function(off) {
				const roff = {"x":Math.floor(off.x/100),"y":Math.floor(off.y/100)}
				if (turn) {
					switch (seltype) {
						case (0):
							const rules = units[draw[sel]].placeRule
							if (sel != undefined && (!rules || rules.colour == undefined || (roff.x+roff.y)%2 == rules.colour) && mana >= (units[draw[sel]].cost ?? 0) && ((pid == 0 && roff.x >= 8) || (pid == 1 && roff.x <= 1)) && !enemUnits.some(u => u.x==roff.x && u.y==roff.y) && !myUnits.some(u => u.x==roff.x && u.y==roff.y)) {
								const newunit = {"x":roff.x,"y":roff.y,"type":draw[sel],"moved":2};
								mana -= (units[newunit.type].cost ?? 0)
								myUnits.push(newunit);
								procSpec(units[newunit.type].spawn ?? {},true)
								sendData({...newunit,"dataType":0});
								draw.splice(sel,1);
								sel = undefined;
								seltype = undefined;
							}
							break;
						case (undefined):
							const found = myUnits.findIndex(u => u.moved < 2 && u.x == roff.x && u.y == roff.y && (((u.moved == 1 || (units[u.type].move ?? {}).nofree) && mana > 0) || (u.moved == 0 && !(units[u.type].move ?? {}).nofree)))
							if (found != -1) {
								sel = found
								seltype = 1
								movements = []
								const un = myUnits[sel]
								const unit = units[un.type]
								let hoff
								let voff
								if (unit.move) {
									processMove(un,unit,false)
								}
								attacks = []
								if (unit.attack && un.moved < 2 && mana > 0) {
									[].concat(unit.attack).forEach((at) => {
										if (typeof at == "object") {
											switch (at.style) {
												case (0):
													processMove(un,unit,true,at)
													break;
												case (1):
													voff = Math.floor(at.set.length/2)+(at.offset ?? [0,0])[1]
													at.set.forEach((e,ee) => {
														hoff = Math.floor(e.length/2)+(at.offset ?? [0,0])[0]
														e.forEach((r,rr) => {
															if (r && enemUnits.some(u => (!(units[u.type].death ?? {}).lose || !at.nolose) && u.x == un.x-hoff+rr && u.y == un.y-voff+ee) && !myUnits.some(u => u.x == un.x-hoff+rr && u.y == un.y-voff+ee)) attacks.push({"x":(un.x-hoff+rr),"y":(un.y-voff+ee),...at,"set":undefined})
														})
													})
													break;
												case (2):
													hoff = Math.floor(at.size[0]/2)
													voff = Math.floor(at.size[1]/2)
													const gof = (at.offset ?? [0,0])
													if (enemUnits.some(u => (!(units[u.type].death ?? {}).lose || !at.nolose) && Math.abs(u.x-un.x-gof[0]) <= hoff && Math.abs(u.y-un.y-gof[1]) <= voff)) attacks.push({"x":(un.x-hoff)+gof[0],"y":(un.y-voff)+gof[1],"pierce":true,"w":at.size[0],"h":at.size[1],...at,"set":undefined})
													break;
												case (3):
													voff = Math.floor(at.set.length/2)-(at.offset ?? [0,0])[1]
													let co = []
													at.set.forEach((e,ee) => {
														hoff = Math.floor(e.length/2)-(at.offset ?? [0,0])[0]
														e.forEach((r,rr) => {
															if (r) co.push({"x":un.x-hoff+rr,"y":un.y-voff+ee})
														})
													})
													const ws = co.map(a => a.x)
